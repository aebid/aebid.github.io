# Site settings
title: Devin Aebi
description: Physicist
# Shown as the site's base URL. For a user site (user.github.io) leave baseurl empty.
baseurl: ""
url: "https://aebid.github.io"

# Theme (an official GitHub Pages theme, no plugin allowlist issues)
theme: jekyll-theme-slate

# Slate theme options
show_downloads: false
# google_analytics: UA-XXXXXXXX-X

# Author / contact details used by the nav and footer
author:
  name: Devin Aebi
  email: devin.aebi@proton.me
  github: aebid
  # orcid:
  linkedin: devin-aebi
  # inspire:
  # Path to the CV/resume PDF. Comment this out to hide the CV link everywhere.
  cv: /assets/pdf/devin-aebi-cv.pdf

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Build settings
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .jekyll-cache

# Every page/post gets the nav-wrapped layout by default
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
